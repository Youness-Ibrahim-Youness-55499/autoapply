<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>German ATS Jobs Lab</title><link rel="stylesheet" href="/static/style.css"></head>
<body><main><header><p class="eyebrow">ISOLATED LOCAL TEST</p><h1>German jobs from public ATS boards</h1><p id="summary">Loading verified sources…</p></header>
<section class="filters" aria-label="Job filters"><label>ATS<select id="source"><option value="">All ATS providers</option></select></label><label>Search<input id="query" placeholder="Role, company or city"></label></section>

<p class="status" id="status"></p><section class="jobs" id="jobs"></section></main><script src="/static/app.js"></script></body></html>
