[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "jobman-job-ingestion"
version = "0.1.0"
description = "Isolated, extensible German ATS job ingestion service for Jobman"
requires-python = ">=3.12"
dependencies = [
  "beautifulsoup4==4.13.4",
  "fastapi==0.116.1",
  "httpx==0.28.1",
  "lxml==6.0.0",
  "pydantic==2.11.7",
  "PyYAML==6.0.2",
  "SQLAlchemy==2.0.43",
  "tenacity==9.1.2",
  "uvicorn==0.35.0",
]

[project.optional-dependencies]
test = ["pytest==8.4.1"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.setuptools.packages.find]
include = ["joblab*"]
